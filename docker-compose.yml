# Les services (conteneurs) du projet ShopFlow
services:

  # Base de données de "production" de la boutique
  postgres:
    image: postgres:16                  # image officielle PostgreSQL, version 16
    container_name: shopflow-postgres   # nom fixe, plus simple à retenir
    env_file: .env                      # lit utilisateur, mot de passe et base dans .env
    ports:
      - "5432:5432"                     # port de ton PC : port du conteneur
    volumes:
      - pgdata:/var/lib/postgresql/data # les données survivent à l'arrêt du conteneur
    healthcheck:                        # Docker vérifie que la base est prête
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

# Espaces de stockage gérés par Docker
volumes:
  pgdata: